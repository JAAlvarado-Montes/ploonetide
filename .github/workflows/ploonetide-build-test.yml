# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: ploonetide-build-test

on:
  push:
    paths-ignore:
      - "tutorials/**"
    branches: [ develop ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      run: |
        pip install poetry
        poetry config virtualenvs.create false

    - name: Install dependencies from pyproject.toml
      run: |
        poetry install --no-interaction --with dev

    - name: Lint for Python errors
      run: |
        poetry run flake8 src/ploonetide tests --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Report broader style debt
      run: |
        poetry run flake8 src/ploonetide tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        poetry run pytest -q
